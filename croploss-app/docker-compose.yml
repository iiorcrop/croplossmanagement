services:
  # ── Backend API ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: croploss-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=7070
    ports:
      - "7070:7070"
    networks:
      - croploss-net
    volumes:
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Nginx serving Vite build) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: croploss-frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    ports:
      - "7001:80"
    networks:
      - croploss-net
    depends_on:
      - backend

networks:
  croploss-net:
    driver: bridge
